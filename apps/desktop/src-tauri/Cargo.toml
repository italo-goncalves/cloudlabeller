[package]
name = "cloudlabeller-desktop"
version = "0.2.1"
description = "CloudLabeller's desktop core: the Environment, the Engine, the Jobs"
authors = ["Ítalo Gomes Gonçalves"]
license = "GPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.80"

[lib]
name = "cloudlabeller_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# the Environment manager, processes and GPU Lease shared with GeoScape
# (Apache-2.0, RockAnalytica) — ADR-0001
geokit-env = { git = "https://github.com/rockanalytica/geokit", tag = "v0.2.0" }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
