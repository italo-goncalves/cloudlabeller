# The desktop app's Windows installer (docs/desktop.md).
#
# On a v* tag: a signed installer, its .sig and latest.json attached to the
# GitHub Release, which is what the updater reads. On dev: an unsigned
# installer kept as a build artefact, which the updater never offers.
#
# Signing needs the repository secret TAURI_SIGNING_PRIVATE_KEY (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one), made with
# `pnpm --filter @cloudlabeller/desktop tauri signer generate`; its public
# key goes in apps/desktop/src-tauri/tauri.conf.json.

name: desktop

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @cloudlabeller/desktop resources
      - name: Build (signed)
        if: env.SIGN == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @cloudlabeller/desktop tauri build --config src-tauri/tauri.updater.conf.json
      - name: Build (unsigned)
        if: env.SIGN != 'true'
        run: pnpm --filter @cloudlabeller/desktop tauri build
      - run: node apps/desktop/scripts/latest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: apps/desktop/publish/*
      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "CloudLabeller ${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" apps/desktop/publish/* --clobber
